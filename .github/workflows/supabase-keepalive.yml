name: Supabase Keepalive

# Evita che il progetto Supabase free vada in pausa per inattività e, se è
# già in pausa, prova a riattivarlo da solo via Management API.
#
# Secret (Settings → Secrets and variables → Actions):
#   SUPABASE_URL          → opzionale, override URL progetto
#   SUPABASE_ANON_KEY     → opzionale, override chiave anon/public
#   SUPABASE_ACCESS_TOKEN → necessario SOLO per la riattivazione automatica.
#                            Personal Access Token Supabase (Account →
#                            Access Tokens). Senza questo secret il workflow
#                            continua comunque a fare da ping preventivo, ma
#                            se il progetto è già in pausa va riattivato a
#                            mano dalla dashboard (vedi .github/GITHUB_SECRETS.md).
#
# Se URL/ANON_KEY mancano, usa gli stessi default pubblici già presenti in
# index.html (l'anon key è client-side, non è un segreto critico).

on:
  schedule:
    # Ogni 2 giorni: Supabase mette in pausa un progetto Free dopo 7 giorni
    # senza attività sul DB. Un margine di 2 giorni (invece di ridosso a 7)
    # assorbe un run saltato/fallito senza rischiare la pausa.
    - cron: "0 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        id: ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # Default pubblici già nel repo (anon key = client-side, non è un secret critico).
          DEFAULT_URL="https://pobrjdrqpzerjlcqnpra.supabase.co"
          DEFAULT_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvYnJqZHJxcHplcmpsY3FucHJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE0ODgyODMsImV4cCI6MjA3NzA2NDI4M30.p2XZ7tA-OPye2T5hGhx89BNF-kyhTcnrnt33ho0jDKU"

          URL="${SUPABASE_URL:-}"
          KEY="${SUPABASE_ANON_KEY:-}"

          if [ -z "${URL}" ] || [ -z "${KEY}" ]; then
            echo "::warning::Secret SUPABASE_URL / SUPABASE_ANON_KEY assenti: uso i default del progetto Timbrature Online."
            URL="${URL:-$DEFAULT_URL}"
            KEY="${KEY:-$DEFAULT_ANON_KEY}"
          fi

          BASE="${URL%/}"
          # Ref progetto = sottodominio (es. pobrjdrqpzerjlcqnpra), serve per
          # l'eventuale restore via Management API nello step successivo.
          REF="$(echo "${BASE}" | sed -E 's#https?://([^.]+)\.supabase\.co.*#\1#')"
          echo "project_ref=${REF}" >> "$GITHUB_OUTPUT"

          HTTP_CODE=$(curl -sS -o /tmp/keepalive_response.json -w "%{http_code}" \
            "${BASE}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            --connect-timeout 20 \
            --max-time 45) || {
              echo "::error::curl fallito (rete o DNS). Controlla che il progetto Supabase sia attivo."
              exit 1
            }

          echo "Supabase keepalive HTTP code: ${HTTP_CODE}"
          head -c 500 /tmp/keepalive_response.json 2>/dev/null || true
          echo ""

          case "${HTTP_CODE}" in
            200|201|204|401|403|406)
              echo "OK: API raggiungibile (codice ${HTTP_CODE})."
              echo "paused=false" >> "$GITHUB_OUTPUT"
              ;;
            502|503|504)
              echo "::warning::Supabase non disponibile (${HTTP_CODE}): il progetto è probabilmente in pausa."
              echo "paused=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              if [ "${HTTP_CODE}" -lt 200 ] 2>/dev/null || [ "${HTTP_CODE}" -ge 500 ] 2>/dev/null; then
                echo "::error::Ping fallito con HTTP ${HTTP_CODE}"
                exit 1
              fi
              echo "OK: risposta HTTP ${HTTP_CODE} (progetto attivo)."
              echo "paused=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Riattiva il progetto in pausa (Management API)
        if: steps.ping.outputs.paused == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.ping.outputs.project_ref }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Progetto in pausa e secret SUPABASE_ACCESS_TOKEN assente: impossibile riattivarlo automaticamente. Vai su https://supabase.com/dashboard/project/${PROJECT_REF} e clicca 'Restore project', oppure aggiungi il secret (vedi .github/GITHUB_SECRETS.md) perché il workflow lo faccia da solo la prossima volta."
            exit 1
          fi

          HTTP_CODE=$(curl -sS -o /tmp/restore_response.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/restore" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --connect-timeout 20 \
            --max-time 45) || {
              echo "::error::Chiamata al Management API fallita (rete/DNS)."
              exit 1
            }

          echo "Restore API HTTP code: ${HTTP_CODE}"
          cat /tmp/restore_response.json 2>/dev/null || true
          echo ""

          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
            echo "OK: richiesta di riattivazione inviata. Il ripristino richiede alcuni minuti; sarà confermato dal prossimo ping (o da un giro manuale di Actions → Supabase Keepalive → Run workflow)."
          else
            echo "::error::Riattivazione fallita (HTTP ${HTTP_CODE}). Riattiva manualmente da https://supabase.com/dashboard/project/${PROJECT_REF}."
            exit 1
          fi
