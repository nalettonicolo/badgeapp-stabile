# Pubblica un aggiornamento OTA (EAS Update) per l'app mobile su ogni push
# su main/master che tocca la cartella mobile.
#
# Il sito web NON viene pubblicato da questo workflow: Netlify è collegato al
# repo via integrazione Git nativa (legge netlify.toml dalla root, publish
# "."), quindi fa deploy in produzione da solo a ogni push su main e genera
# preview automatiche sulle Pull Request. Un secondo deploy via Netlify CLI
# qui sarebbe ridondante e rischierebbe di divergere da quello nativo.
#
# Segreti GitHub da configurare (Settings → Secrets → Actions):
#   EXPO_TOKEN           — token Expo (expo.dev → Access Tokens); per EAS Update
# Opzionale in CI per project EAS:
#   EAS_PROJECT_ID       — UUID progetto Expo (stesso di extra.eas.projectId dopo eas init)

name: Publish mobile OTA

on:
  push:
    branches: [main, master]
    paths:
      - 'badgeapp-mobile/**'
      - '.github/workflows/publish-mobile-ota.yml'
  workflow_dispatch:

jobs:
  eas-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: badgeapp-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: badgeapp-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: EAS Update (OTA)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN non impostato: salto EAS Update (configura il secret per OTA automatici)."
            exit 0
          fi
          npx eas-cli update --channel production --non-interactive --message "CI ${{ github.sha }}"
